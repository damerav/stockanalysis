apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "10s"

  - name: SQLite-History
    type: marcusolsson-json-datasource
    access: proxy
    url: http://host.docker.internal:9190
    uid: sqlite-history
    isDefault: false
    editable: false
