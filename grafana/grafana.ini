# ============================================================
# Grafana Configuration — Stock Analysis Platform
# Google OAuth + RBAC
# ============================================================

[server]
http_port = 3000
# root_url is set via GF_SERVER_ROOT_URL env var in docker-compose.
# Default: auto-detect from request (no port suffix works for reverse proxies).
root_url = %(protocol)s://%(domain)s/
serve_from_sub_path = false

[security]
admin_user = admin
admin_password = ${GF_SECURITY_ADMIN_PASSWORD}
allow_embedding = true

[users]
allow_sign_up = false
auto_assign_org = true
auto_assign_org_role = Viewer

[auth]
disable_login_form = false
oauth_auto_login = false

# ============================================================
# Auth Proxy — Streamlit passes authenticated user via header
# The metrics exporter proxy injects X-WEBAUTH-USER after
# validating the session token from Streamlit OAuth.
# ============================================================

[auth.proxy]
enabled = true
header_name = X-WEBAUTH-USER
header_property = email
auto_sign_up = true
headers = "Name:X-WEBAUTH-USER"
enable_login_token = true

# ============================================================
# Google OAuth Configuration
# ============================================================
# To set up:
# 1. Go to https://console.cloud.google.com/apis/credentials
# 2. Create OAuth 2.0 Client ID (Web application)
# 3. Add authorized redirect URI:
#    http://<YOUR_DGX_IP>:3000/login/google
# 4. Set GF_AUTH_GOOGLE_CLIENT_ID and GF_AUTH_GOOGLE_CLIENT_SECRET
#    as environment variables in docker-compose.yml or .env
# ============================================================

[auth.google]
enabled = false
allow_sign_up = true
auto_login = false
client_id = ${GF_AUTH_GOOGLE_CLIENT_ID}
client_secret = ${GF_AUTH_GOOGLE_CLIENT_SECRET}
scopes = openid email profile
auth_url = https://accounts.google.com/o/oauth2/v2/auth
token_url = https://oauth2.googleapis.com/token
api_url = https://openidconnect.googleapis.com/v1/userinfo
# Restrict to specific domain(s) — comma-separated
# Leave empty to allow any Gmail account
allowed_domains = ${GF_AUTH_GOOGLE_ALLOWED_DOMAINS}
# Role mapping: assign Grafana org roles based on email
role_attribute_path = contains(email, '@') && 'Viewer' || 'Viewer'

# ============================================================
# RBAC — Role-Based Access Control
# ============================================================
# Admin role: Full access (dashboards, datasources, users, settings)
# Editor role: Can edit dashboards but not manage users/datasources
# Viewer role: Read-only access to dashboards
#
# To promote a user to Admin after they log in via Google:
#   1. Log in as admin (admin/admin_password)
#   2. Go to Administration > Users
#   3. Find the user and change their role to Admin
#
# Or set via env: GF_USERS_AUTO_ASSIGN_ORG_ROLE=Editor
# ============================================================

[auth.anonymous]
enabled = true
org_role = Viewer

[dashboards]
default_home_dashboard_path = /var/lib/grafana/dashboards/spy-predictor.json

[log]
mode = console
level = info

[unified_alerting]
enabled = true
