services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: stockanalysis-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: stockanalysis
      POSTGRES_USER: stockapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockapp_secure_2024}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-pgvector.sql:/docker-entrypoint-initdb.d/01-init-pgvector.sql:ro
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "effective_cache_size=512MB"
      - "-c"
      - "max_connections=50"
      - "-c"
      - "random_page_cost=1.1"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockapp -d stockanalysis"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
