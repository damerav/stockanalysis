services:
  relay:
    build:
      context: ..
      dockerfile: cloud/Dockerfile.relay
    ports:
      - "8000:8000"
    environment:
      - RELAY_API_KEY=${RELAY_API_KEY:-changeme}
      - RELAY_ADMIN_KEY=${RELAY_ADMIN_KEY:-admin-changeme}
    restart: unless-stopped

  dashboards:
    build:
      context: ..
      dockerfile: cloud/Dockerfile.dashboard
    ports:
      - "8501:8501"
    environment:
      - RELAY_URL=http://relay:8000
    depends_on:
      - relay
    restart: unless-stopped

  # ============================================================
  # Grafana + Prometheus Monitoring Stack
  # ============================================================

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9092:9090"
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      # Admin credentials
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      # Google OAuth — set these in .env file
      - GF_AUTH_GOOGLE_CLIENT_ID=${GF_AUTH_GOOGLE_CLIENT_ID:-}
      - GF_AUTH_GOOGLE_CLIENT_SECRET=${GF_AUTH_GOOGLE_CLIENT_SECRET:-}
      - GF_AUTH_GOOGLE_ALLOWED_DOMAINS=${GF_AUTH_GOOGLE_ALLOWED_DOMAINS:-}
      # Install JSON API datasource plugin for historical data
      - GF_INSTALL_PLUGINS=marcusolsson-json-datasource
    volumes:
      - ../grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
