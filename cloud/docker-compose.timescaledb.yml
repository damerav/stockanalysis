# TimescaleDB + pgvector — drop-in replacement for postgres:16-alpine
# Usage:
#   docker compose -f cloud/docker-compose.timescaledb.yml up -d
#
# Migration from existing postgres container:
#   1. pg_dump the existing database
#   2. Stop old container
#   3. Start this container (fresh volume)
#   4. pg_restore into the new container
#   5. Run: python -m src.data.migrate_to_timescaledb
#
# Or for in-place extension install (if using pgvector/pgvector:pg16):
#   Just run: python -m src.data.migrate_to_timescaledb
#   It will install the extension and convert tables.

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: stockanalysis-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: stockanalysis
      POSTGRES_USER: stockapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockapp_secure_2024}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-timescaledb.sql:/docker-entrypoint-initdb.d/01-init-timescaledb.sql:ro
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "effective_cache_size=512MB"
      - "-c"
      - "max_connections=50"
      - "-c"
      - "random_page_cost=1.1"
      # TimescaleDB tuning
      - "-c"
      - "timescaledb.max_background_workers=4"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockapp -d stockanalysis"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
