polygon:
  api_key: "YOUR_POLYGON_KEY"
  ws_stocks_url: "wss://socket.polygon.io/stocks"
  ws_options_url: "wss://socket.polygon.io/options"

analysis:
  signal_interval: 300
  flow_sweep_threshold: 50000
  flow_block_threshold: 100000

llm:
  model: "deepseek-r1:70b"
  base_url: "http://localhost:11434"
  temperature: 0.3

xgboost:
  lookback_days: 252
  max_depth: 6
  learning_rate: 0.05
  n_estimators: 500
  neutral_threshold: 0.003

technicals:
  sma_periods: [20, 50]
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  bb_period: 20
  bb_std: 2
  atr_period: 14

sync:
  enabled: false
  relay_url: "https://your-ec2-ip:8000"
  api_key: "YOUR_RELAY_API_KEY"

es_strategy:
  credit_C: 10.0
  strike_K: 6000.0
  max_lots: 3
  jump_exit_points: 5.0
  emergency_stop_pct: 0.20
  circuit_breaker_usd: -2000.0
  session_close_ct: "15:55"
  session_reset_ct: "17:00"
  ai_enabled: false
  ai_fail_closed: true          # GAP 16: block trades if AI unavailable
  entry_conf_threshold: 0.70    # GAP 3: entry gate threshold per spec
  regime_lookback: 10080
  regime_pct_low: 33
  regime_pct_high: 66

alerts:
  telegram_token: ""
  telegram_chat_id: ""
  email_smtp: ""
  email_from: ""
  email_to: ""

whatif:
  enabled: true
  max_sims: 1000
  max_concurrent_cloud: 1
  narrator_temperature: 0.5
  narrator_max_tokens: 800
  es_default_lookback_days: 20
  spy_default_noise_pct: 2.0

database:
  path: "./data/spy.db"

# Authentication
auth:
  mode: "local"                  # "local" or "google"
  session_secret: "change-me-to-random-secret"  # Signs session tokens
  # Local users (mode: local)
  users:
    admin:
      password: "admin123"
      role: "admin"
      name: "Administrator"
    user:
      password: "user123"
      role: "viewer"
      name: "Default User"
  # Google OAuth (mode: google)
  google_client_id: ""           # Set via GOOGLE_CLIENT_ID env var or here
  google_client_secret: ""       # Set via GOOGLE_CLIENT_SECRET env var or here
  allowed_domains: []            # e.g. ["gmail.com"] — empty = any Google account
  allowed_emails: []             # e.g. ["user@gmail.com"] — empty = no whitelist

# Real-time AI Confidence API (GAP 2)
confidence_api:
  host: "0.0.0.0"
  port: 8100
  audit_log: "./logs/trade_audit.jsonl"

# P2: Stacking Ensemble
ensemble:
  enabled: false                 # Set true to enable XGBoost+BiLSTM+LightGBM ensemble
  bilstm_seq_len: 20
  bilstm_hidden: 128
  bilstm_epochs: 30

# P2: Conformal Prediction
conformal:
  enabled: true
  significance: 0.10             # 90% coverage

# P2: HMM Regime Detection
regime:
  n_states: 4
  model_dir: "./models"

# P2: Adaptive Training Window
adaptive_window:
  candidates: [63, 126, 252, 504]
  validation_days: 21
