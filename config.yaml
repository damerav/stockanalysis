polygon:
  api_key: "YOUR_POLYGON_KEY"
  ws_stocks_url: "wss://socket.polygon.io/stocks"
  ws_options_url: "wss://socket.polygon.io/options"

analysis:
  signal_interval: 300
  flow_sweep_threshold: 50000
  flow_block_threshold: 100000

llm:
  model: "deepseek-r1:70b"
  base_url: "http://localhost:11434"
  temperature: 0.3

xgboost:
  lookback_days: 252
  max_depth: 6
  learning_rate: 0.05
  n_estimators: 500
  neutral_threshold: 0.003

technicals:
  sma_periods: [20, 50]
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  bb_period: 20
  bb_std: 2
  atr_period: 14

sync:
  enabled: false
  relay_url: "https://your-ec2-ip:8000"
  api_key: "YOUR_RELAY_API_KEY"

es_strategy:
  credit_C: 10.0
  strike_K: 6000.0
  max_lots: 3
  jump_exit_points: 5.0
  emergency_stop_pct: 0.20
  circuit_breaker_usd: -2000.0
  session_close_ct: "15:55"
  session_reset_ct: "17:00"
  ai_enabled: false
  regime_lookback: 10080
  regime_pct_low: 33
  regime_pct_high: 66

alerts:
  telegram_token: ""
  telegram_chat_id: ""
  email_smtp: ""
  email_from: ""
  email_to: ""

whatif:
  enabled: true
  max_sims: 1000
  max_concurrent_cloud: 1
  narrator_temperature: 0.5
  narrator_max_tokens: 800
  es_default_lookback_days: 20
  spy_default_noise_pct: 2.0

database:
  path: "./data/spy.db"
